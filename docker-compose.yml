version: '3.8'

services:
  backend:
    build:
      context: ./backend_files
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    networks:
      - superkart_network
    restart: always

  frontend:
    build:
      context: ./frontend_files
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://host.docker.internal:7860  # adjusted to fix connection issues
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - superkart_network
    restart: always

networks:
  superkart_network:
    driver: bridge
